<!-- 화면(MVC) 컨트롤러에서 처리되지 않은 예외가 발생했을 때 Spring Boot가 기본으로 렌더링하는 에러 페이지 -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Muzip - 오류</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #7ec8f2;
            --bg-bottom: #d6f3e6;
            --surface-strong: rgba(255, 255, 255, 0.42);
            --border: rgba(255, 255, 255, 0.55);
            --ink: #0b3456;
            --ink-muted: #4d7292;
            --cyan: #00aaff;
            --danger: #ff2f92;
            --aero-shadow: 0 10px 35px rgba(0, 60, 120, 0.25);
            --aero-inner-shadow: inset 0 1px 3px rgba(255, 255, 255, 0.65);
            --aero-highlight: rgba(255, 255, 255, 0.75);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            background:
                    radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.35) 0%, rgba(255, 255, 255, 0) 55%),
                    linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            color: var(--ink);
            font-family: 'Noto Sans KR', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .auth-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 380px;
            margin: 20px;
            text-align: center;
            background: var(--surface-strong);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--border);
            border-top: 1.5px solid var(--aero-highlight);
            border-left: 1.5px solid var(--aero-highlight);
            border-radius: 28px;
            padding: 36px 32px;
            box-shadow: var(--aero-shadow), var(--aero-inner-shadow);
        }

        .auth-logo {
            font-family: 'Baloo 2', sans-serif;
            font-weight: 700;
            font-size: 1.6rem;
            color: var(--ink);
            margin-bottom: 6px;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.7), 0 0 10px rgba(0, 170, 255, 0.25);
        }

        .error-status {
            color: var(--danger);
            font-weight: 700;
            font-size: 0.9rem;
            margin: 8px 0 4px;
        }

        .error-message {
            color: var(--ink-muted);
            font-size: 0.88rem;
            margin-bottom: 24px;
        }

        .auth-btn {
            display: inline-block;
            border: 1px solid #005588;
            border-top: 1.5px solid #a3e8ff;
            cursor: pointer;
            padding: 12px 28px;
            font-weight: 700;
            font-size: 0.9rem;
            color: #fff;
            text-decoration: none;
            background: linear-gradient(to bottom, #4cd3ff 0%, #0088cc 50%, #0066aa 100%);
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0, 100, 200, 0.3), inset 0 1px 2px rgba(255, 255, 255, 0.4);
        }
    </style>
</head>
<body>

<div class="auth-card">
    <div class="auth-logo">Muzip</div>
    <div class="error-status" th:if="${status}" th:text="'오류 코드: ' + ${status}"></div>
    <div class="error-message">요청을 처리하는 중 문제가 발생했습니다.<br>잠시 후 다시 시도해 주세요.</div>
    <a th:href="@{/}" class="auth-btn">홈으로</a>
</div>

</body>
</html>
