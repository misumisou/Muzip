<!-- 로그인 페이지: Spring Security formLogin이 렌더링하는 화면 -->
<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Muzip - 로그인</title>
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700&family=Noto+Sans+KR:wght@400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-top: #7ec8f2;
            --bg-bottom: #d6f3e6;
            --surface: rgba(255, 255, 255, 0.32);
            --surface-strong: rgba(255, 255, 255, 0.42);
            --border: rgba(255, 255, 255, 0.55);
            --ink: #0b3456;
            --ink-muted: #4d7292;
            --cyan: #00aaff;
            --blue: #00d4ff;
            --danger: #ff2f92;
            --aero-shadow: 0 10px 35px rgba(0, 60, 120, 0.25);
            --aero-inner-shadow: inset 0 1px 3px rgba(255, 255, 255, 0.65);
            --aero-highlight: rgba(255, 255, 255, 0.75);
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            min-height: 100vh;
            background:
                    radial-gradient(circle at 50% 0%, rgba(255, 255, 255, 0.35) 0%, rgba(255, 255, 255, 0) 55%),
                    linear-gradient(180deg, var(--bg-top), var(--bg-bottom));
            color: var(--ink);
            font-family: 'Noto Sans KR', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow-x: hidden;
        }

        .ambient {
            position: fixed;
            border-radius: 50%;
            filter: blur(120px);
            opacity: 0.45;
            z-index: 0;
            pointer-events: none;
        }
        .ambient-a { width: 460px; height: 460px; background: var(--cyan); top: -180px; left: -120px; }
        .ambient-b { width: 380px; height: 380px; background: #39d353; bottom: -160px; right: -100px; }

        .auth-card {
            position: relative;
            z-index: 1;
            width: 100%;
            max-width: 380px;
            margin: 20px;
            background: var(--surface-strong);
            backdrop-filter: blur(20px) saturate(180%);
            -webkit-backdrop-filter: blur(20px) saturate(180%);
            border: 1px solid var(--border);
            border-top: 1.5px solid var(--aero-highlight);
            border-left: 1.5px solid var(--aero-highlight);
            border-radius: 28px;
            padding: 36px 32px;
            box-shadow: var(--aero-shadow), var(--aero-inner-shadow);
        }

        .auth-logo {
            font-family: 'Baloo 2', sans-serif;
            font-weight: 700;
            font-size: 1.6rem;
            color: var(--ink);
            text-align: center;
            margin-bottom: 6px;
            text-shadow: 0 1px 2px rgba(255, 255, 255, 0.7), 0 0 10px rgba(0, 170, 255, 0.25);
        }
        .auth-sub {
            text-align: center;
            color: var(--ink-muted);
            font-size: 0.86rem;
            margin-bottom: 28px;
        }

        .field { margin-bottom: 14px; }
        .field label {
            display: block;
            font-size: 0.8rem;
            font-weight: 600;
            color: var(--ink-muted);
            margin-bottom: 6px;
            padding-left: 2px;
        }
        .field input {
            width: 100%;
            background: rgba(255, 255, 255, 0.4);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px 16px;
            font-size: 0.92rem;
            color: var(--ink);
            outline: none;
            transition: border-color 0.2s ease, background 0.2s ease;
            box-shadow: inset 0 1px 2px rgba(0, 60, 120, 0.08);
        }
        .field input:focus {
            border-color: var(--cyan);
            background: rgba(255, 255, 255, 0.65);
            box-shadow: inset 0 1px 2px rgba(0, 60, 120, 0.08), 0 0 8px rgba(0, 170, 255, 0.3);
        }

        .auth-error {
            background: rgba(255, 47, 146, 0.14);
            border: 1px solid rgba(255, 47, 146, 0.35);
            color: var(--danger);
            font-size: 0.82rem;
            border-radius: 12px;
            padding: 10px 14px;
            margin-bottom: 16px;
        }

        .auth-btn {
            width: 100%;
            border: 1px solid #005588;
            border-top: 1.5px solid #a3e8ff;
            cursor: pointer;
            padding: 13px;
            margin-top: 8px;
            font-weight: 700;
            font-size: 0.92rem;
            color: #fff;
            background: linear-gradient(to bottom, #4cd3ff 0%, #0088cc 50%, #0066aa 100%);
            border-radius: 14px;
            box-shadow: 0 4px 15px rgba(0, 100, 200, 0.3), inset 0 1px 2px rgba(255, 255, 255, 0.4);
            text-shadow: 0 -1px 1px rgba(0, 0, 0, 0.2);
            transition: transform 0.1s ease, box-shadow 0.2s ease;
        }
        .auth-btn:hover {
            background: linear-gradient(to bottom, #60dbff 0%, #0099dd 50%, #0077bb 100%);
            box-shadow: 0 6px 20px rgba(0, 100, 200, 0.45), 0 0 10px rgba(0, 240, 255, 0.3), inset 0 1px 2px rgba(255, 255, 255, 0.6);
        }
        .auth-btn:active { transform: scale(0.98); }

        .auth-footer {
            text-align: center;
            margin-top: 20px;
            font-size: 0.84rem;
            color: var(--ink-muted);
        }
        .auth-footer a {
            color: var(--cyan);
            font-weight: 600;
            text-decoration: none;
        }
    </style>
</head>
<body>

<div class="ambient ambient-a"></div>
<div class="ambient ambient-b"></div>

<div class="auth-card">
    <div class="auth-logo">Muzip</div>
    <div class="auth-sub">로그인하고 이용해보세요!</div>

    <!-- Security가 로그인 실패 시 /login?error 로 리다이렉트함 -->
    <div th:if="${param.error}" class="auth-error">
        아이디 또는 비밀번호가 올바르지 않습니다.
    </div>

    <form th:action="@{/login}" method="post">
        <div class="field">
            <label for="username">아이디</label>
            <input type="text" id="username" name="username" required autofocus>
        </div>
        <div class="field">
            <label for="password">비밀번호</label>
            <input type="password" id="password" name="password" required>
        </div>
        <button type="submit" class="auth-btn">로그인</button>
    </form>

    <div class="auth-footer">
        계정이 없으신가요? <a href="/signUp">회원가입</a>
    </div>
</div>

</body>
</html>
